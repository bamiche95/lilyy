name: DevSecOps Security Pipeline

on:
  push:
    # This repository's default branch is `master`, so watching `main` alone
    # meant the pipeline never fired. `main` stays listed for a future rename.
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  # Lets the pipeline be started on demand from the Actions tab, with
  # `gh workflow run devsecops.yml --ref master`, or via the REST API.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # code scanning SARIF upload

jobs:
  code-and-secrets-scan:
    name: Secrets, SAST & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `returntocorp/semgrep-action` is archived, and it uploads SARIF itself,
      # which needs GitHub Advanced Security on a private repository. Running the
      # official image keeps the rules current and keeps the gate local: the
      # scan exits 1 on ERROR-severity findings, the upload is best-effort.
      - name: SAST Static Code Analysis (Semgrep)
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            --entrypoint semgrep \
            semgrep/semgrep:latest \
            scan \
              --config p/owasp-top-ten \
              --severity ERROR \
              --error \
              --sarif --output semgrep.sarif

      - name: Upload SAST results to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Dependency Vulnerability Scan (Trivy SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          # Only fail on findings we can actually act on; unfixable advisories
          # would otherwise wedge the pipeline. Deliberate suppressions live in
          # .trivyignore.yaml (each one carries a reason and an expiry date).
          ignore-unfixed: true
          # Point Trivy at the documented suppressions explicitly. Keep this the
          # only ignore file in the repo: Trivy errors out when an explicit
          # ignore file coexists with an implicit .trivyignore in the scan root,
          # so a stray .trivyignore would break the gate.
          trivyignores: '.trivyignore.yaml'
          exit-code: '1'
          # SARIF is produced alongside the console report so findings land in the
          # Security tab; the exit code above stays the actual gate.
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload dependency scan results to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  container-and-iac-scan:
    name: Container Hardening & IaC Audit
    runs-on: ubuntu-latest
    # `next build` prerenders the Prisma-backed pages, so the image build needs a
    # reachable database. This throwaway instance only exists for the build.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # One throwaway server, two spellings: migrations run on the runner
      # (`localhost`), while `docker build` reaches the same published port via
      # the host gateway (see --add-host below).
      #
      # The name must be DATABASE_URL_UNPOOLED, not DIRECT_URL: prisma/schema.prisma
      # declares `directUrl = env("DATABASE_URL_UNPOOLED")`, so `prisma migrate
      # deploy` aborts without it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/app
      BUILD_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for schema migration)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision build database schema
        run: npx prisma migrate deploy

      - name: Build Production Docker Image
        run: >
          docker build
          --add-host host.docker.internal:host-gateway
          --build-arg DATABASE_URL="$BUILD_DATABASE_URL"
          --build-arg DATABASE_URL_UNPOOLED="$BUILD_DATABASE_URL"
          -t app-security-check:${{ github.sha }} .

      - name: Scan Container Image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'app-security-check:${{ github.sha }}'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-image.sarif'

      - name: Upload container scan results to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
