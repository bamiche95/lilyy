<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Lilyy Bakers</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #3b2a20;
        color: #fdf6e3;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      .logo {
        display: block;
        width: 180px;
        height: auto;
        margin: 0 auto;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 28px;
        font-weight: normal;
      }
      p {
        margin: 0 auto;
        max-width: 32ch;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: rgba(253, 246, 227, 0.72);
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: #fdf6e3;
        color: #3b2a20;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/images/lilyy-logo.png" alt="Lilyy Bakers" width="180" height="73" />
      <h1>You are offline</h1>
      <p>
        The bakery needs a connection to show live prices and availability. Your basket is safe —
        reconnect and pick up where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
