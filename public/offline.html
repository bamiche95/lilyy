<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Lilyy Bakers</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbf7ef;
        color: #3b2a20;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #6b5443;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 28px;
        font-weight: normal;
      }
      p {
        margin: 0 auto;
        max-width: 32ch;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: #6b5443;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: #3b2a20;
        color: #fbf7ef;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Lilyy Bakers</p>
      <h1>You are offline</h1>
      <p>
        The bakery needs a connection to show live prices and availability. Your basket is safe —
        reconnect and pick up where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
